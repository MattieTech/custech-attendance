<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CUSTECH Digital Attendance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #faf8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1e293b;
      text-align: center;
      padding: 24px;
    }
    .logo-box {
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 20px;
      font-weight: 900;
      color: #743c22;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 24px;
      max-width: 280px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #edd7c3;
      border-top-color: #743c22;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <img src="custech-logo.png" alt="CUSTECH">
  </div>
  <h1>CUSTECH ATTENDANCE</h1>
  <p>Confluence University of Science and Technology, Osara</p>
  <div class="spinner"></div>
</body>
</html>
